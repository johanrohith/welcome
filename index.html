<!DOCTYPE html>
<html>
<head>
  <title>Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: black;
      color: white;
      font-size: 18px;
    }
    h1 {
      text-align: center;
    }
    button {
      background: black;
      color: white;
      border: 1px solid white;
      padding: 8px 12px;
      font-size: 16px;
    }
    #close {
      position: fixed;
      top: 10px;
      right: 15px;
      border: none;
      font-size: 22px;
    }
    #game {
      display: none;
      text-align: center;
    }
    #difficulty button {
      margin: 5px;
    }
    #play {
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
<button id="close">×</button>
<h1>Welcome to My Website!</h1>
<p>why are you here</p>
<p>Here are the steps you should do:</p>
<ul>
  <li>Step 1: Close this website, the button is on top right</li>
  <li>Step 2: Do step 1</li>
  <li>
    Step 3: Stop reading
    <button id="stop">Stop</button>
  </li>
  <li>
    Step 4:
    <button id="start">Play my Game</button>
  </li>
</ul>
<div id="game">
  <h2>Reaction Test</h2>
  <p>Choose your difficulty:</p>
  <div id="difficulty">
    <button onclick="choose(2, 'Easy')">Easy</button>
    <button onclick="choose(3, 'Medium')">Medium</button>
    <button onclick="choose(4, 'Hard')">Hard</button>
    <button onclick="dontChoose()">Don't Choose</button>
  </div>
  <button id="play">CLICK ME</button>
  <p id="message"></p>
</div>
<script>
  const closeBtn = document.getElementById("close");
  const stopBtn = document.getElementById("stop");
  const startBtn = document.getElementById("start");
  const game = document.getElementById("game");
  const play = document.getElementById("play");
  const message = document.getElementById("message");
  closeBtn.onclick = () => {
    document.body.querySelectorAll(
      "body > *:not(#close)"
    ).forEach(e => {
      e.style.display = "none";
    });
    closeBtn.innerText = "×";
    const msg = document.createElement("h1");
    msg.id = "niceTry";
    msg.innerText = "Nice try.";
    document.body.appendChild(msg);
    setTimeout(() => {
      location.reload();
    }, 3000);
  };
  
  // STEP 3

stopBtn.onclick = () => {
  const symbols = "!@#$%^&*§¥Æ¤øß≠÷×±~<>?/\\|{}[]";
  const originals = [];
  function scramble(element) {
    element.childNodes.forEach(node => {
      if (node.nodeType === 3 && node.textContent.trim()) {
        originals.push([node, node.textContent]);
        node.textContent = [...node.textContent]
          .map(c =>
            c === " " || c === "\n"
              ? c
              : symbols[Math.floor(Math.random() * symbols.length)]
          )
          .join("");
      }
      else if (node.nodeType === 1) {
        scramble(node);
      }
    });
  }
  scramble(document.body);
  setTimeout(() => {
    originals.forEach(([node, text]) => {
      node.textContent = text;
    });
  }, 3000);
};
  
  startBtn.onclick = () => {
    game.style.display = "block";
    startBtn.style.display = "none";
  };
  function choose(moves, level) {
    let count = 0;
    play.style.display = "inline-block";
    play.innerText = "CLICK ME";
    message.innerText = "";
    play.onclick = () => {
      if (count < moves) {
        count++;
        play.style.position = "relative";
        play.style.left =
          Math.random() * 150 - 75 + "px";
        play.style.top =
          Math.random() * 100 - 50 + "px";
      }
      else {
        play.style.display = "none";
        if (level == "Easy")
          message.innerText =
            "Not bad... but Medium might be more fun.";
        if (level == "Medium")
          message.innerText =
            "Okay, you're getting good at this. Try Hard.";
        if (level == "Hard")
          message.innerText =
            "You actually beat Hard. There's another option... but I wouldn't recommend it.";
      }
    };
  }
  function dontChoose() {
    if (confirm("⚠️ Are you absolutely sure?")) {
      alert("You were warned.");
      location.href =
        "https://youtu.be/dQw4w9WgXcQ";
    }
  }
</script>
</body>
</html>
